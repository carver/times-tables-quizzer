<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Times Tables Quizzer</title>
    <link rel="icon" href="./icons/favicon-48.png" type="image/png" />
    <meta name="theme-color" content="#2563eb" />

    <!-- iOS has no manifest-driven home-screen install path (no
         beforeinstallprompt/appinstalled events either - see main.ts) -
         these are the only tags Safari actually reads for "Add to Home
         Screen": the icon, standalone display, and status bar style. -->
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon-180.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Times Tables" />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
