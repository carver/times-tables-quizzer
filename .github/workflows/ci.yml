name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Only the newest run per branch matters; cancel superseded ones so a
# rapid series of pushes doesn't queue up deploys of stale commits.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm run test

      # Only Chromium: this is a single-Learner app on one household's
      # devices, and the e2e suite exists to cover wiring (routing,
      # persistence across a reload, the takeover queue), not to chase
      # cross-engine rendering differences.
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # Publishes whatever is on main to GitHub Pages, gated on the tests
  # above - main is the version the Learner actually opens, so a red
  # build must never reach it.
  deploy:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      # Bakes real Firebase config into the deployed build so the live
      # site can actually sync (docs/adr/0006), not just local dev - only
      # meaningful once these repo variables are set; until then they're
      # empty and cloudSync.ts falls back to its "demo-" project default
      # (harmless: it just means the deployed site's sync toggle can't
      # reach a real backend yet). Repo *variables*, not secrets - a
      # Firebase web config is public by design (access control is
      # Firestore Security Rules' job, not hiding these values).
      - run: npm run build
        env:
          VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID }}

      # enablement: true asks the action to turn Pages on itself. On this
      # repo that call comes back "Resource not accessible by
      # integration" - creating a Pages site needs repo admin, which the
      # workflow token doesn't have - so Pages has to be switched on once
      # by hand under Settings > Pages > Source: GitHub Actions. It's kept
      # set because it costs nothing once Pages exists, and it means a
      # fork whose token does have the rights needs no manual step.
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - id: deployment
        uses: actions/deploy-pages@v4
